<div class="app-shell">
  <header class="topbar">
    <span class="screen-id">แบบทดสอบ by ชาคริต พนมกาญจนรักษ์</span>
  </header>

  <main class="page-content">
    <section class="page-heading" aria-label="การจัดการข้อมูลบุคคล">
      <button class="button button-primary add-button" type="button" (click)="openAdd()">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" />
        </svg>
        <span>ADD</span>
      </button>
    </section>
    <app-people-table
      [records]="peopleData.records()"
      [loading]="peopleData.loading()"
      [loadError]="peopleData.loadError()"
      (viewRequested)="openView($event)"
      (addRequested)="openAdd()"
      (retryRequested)="reloadPeople()"
    />
  </main>

  <app-add-person-dialog
    [saveError]="saveError()"
    (saveRequested)="savePerson($event)"
  />
  <app-view-person-dialog />
</div>
